name: Build and Push Docker Image

on:
  workflow_dispatch: # 允许我们在网页上手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4 # 🚀 升级到 v4，消灭警告

      - name: 登录 Docker Hub
        uses: docker/login-action@v3 # 🚀 升级到 v3，消灭警告
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 开始构建并推送到 Docker Hub
        uses: docker/build-push-action@v6 # 🚀 升级到 v6，消灭警告
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/mamba-submit:v1
