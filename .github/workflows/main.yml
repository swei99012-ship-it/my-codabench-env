name: Build and Push Docker Image

on:
  workflow_dispatch: # 允许我们在网页上手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest # 使用 GitHub 免费的高配 Linux 服务器
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 开始构建并推送到 Docker Hub (耗时较长，请耐心等待)
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          # 👇 这里改成你的 DockerHub 用户名！比如你的账号叫 fangcheng，就写 fangcheng/mamba-submit:v1
          tags: ${{ secrets.DOCKER_USERNAME }}/mamba-submit:v1
